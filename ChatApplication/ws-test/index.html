
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application - WebSocket Test</title>

    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.1.1/bundles/stomp.umd.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        input, textarea, button {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin: 8px 0;
        }

        textarea {
            min-height: 70px;
        }

        button {
            cursor: pointer;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .buttons button {
            flex: 1;
        }

        #status {
            font-weight: bold;
            margin: 15px 0;
        }

        #messages {
            border: 1px solid #ccc;
            padding: 15px;
            min-height: 200px;
            max-height: 350px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<h2>Chat Application - WebSocket Test</h2>

<label>JWT Access Token</label>
<textarea id="token" placeholder="Paste your JWT token here"></textarea>

<label>Conversation UUID</label>
<input
    type="text"
    id="conversationId"
    placeholder="Enter conversation UUID"
/>

<div class="buttons">
    <button onclick="connect()">Connect</button>
    <button onclick="disconnect()">Disconnect</button>
</div>

<p id="status">Status: Disconnected</p>

<hr>

<h3>Send Message</h3>

<textarea
    id="message"
    placeholder="Enter your message"
></textarea>

<button onclick="sendMessage()">Send Message</button>

<hr>

<h3>Received Messages</h3>

<div id="messages"></div>

<script>
    let stompClient = null;
    let heartbeatInterval = null;

    const HEARTBEAT_INTERVAL = 20000;

    function log(message) {
        const messagesDiv = document.getElementById("messages");

        const time = new Date().toLocaleTimeString();

        messagesDiv.textContent += `[${time}] ${message}\n`;

        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function updateStatus(message) {
        document.getElementById("status").textContent =
            "Status: " + message;
    }

    function getToken() {
        let token = document.getElementById("token").value.trim();

        if (token.startsWith("Bearer ")) {
            token = token.substring(7);
        }

        return token;
    }

    function connect() {
        const token = getToken();

        if (!token) {
            alert("Please enter your JWT token.");
            return;
        }

        if (stompClient && stompClient.active) {
            log("A WebSocket connection is already active.");
            return;
        }

        stompClient = new StompJs.Client({

            brokerURL: "ws://localhost:8080/ws",

            connectHeaders: {
                Authorization: "Bearer " + token
            },

            reconnectDelay: 5000,

            heartbeatIncoming: 10000,
            heartbeatOutgoing: 10000,

            debug: function (message) {
                console.log(message);
            },

            onConnect: function (frame) {

                updateStatus("Connected");

                log("WebSocket connected successfully.");

                // Subscribe to messages sent to the logged-in user.
                stompClient.subscribe(
                    "/user/queue/messages",
                    function (message) {

                        log(
                            "Received message: " + message.body
                        );
                    }
                );

                log("Subscribed to /user/queue/messages");

                // Start Redis presence heartbeat.
                startHeartbeat();
            },

            onStompError: function (frame) {

                updateStatus("STOMP Error");

                log(
                    "STOMP error: " +
                    frame.headers["message"]
                );

                log(frame.body);
            },

            onWebSocketError: function (error) {

                log("WebSocket error occurred.");

                console.error(error);
            },

            onWebSocketClose: function () {

                stopHeartbeat();

                updateStatus("Disconnected");

                log("WebSocket connection closed.");
            }
        });

        stompClient.activate();

        updateStatus("Connecting...");
    }

    function startHeartbeat() {

        // Send the first heartbeat immediately.
        sendHeartbeat();

        // Send another heartbeat every 20 seconds.
        heartbeatInterval = setInterval(function () {

            sendHeartbeat();

        }, HEARTBEAT_INTERVAL);

        log("Presence heartbeat started.");
    }

    function sendHeartbeat() {

        if (!stompClient || !stompClient.connected) {
            return;
        }

        stompClient.publish({

            destination: "/app/presence.heartbeat",

            body: JSON.stringify({
                type: "HEARTBEAT"
            })

        });

        log("Presence heartbeat sent.");
    }

    function stopHeartbeat() {

        if (heartbeatInterval !== null) {

            clearInterval(heartbeatInterval);

            heartbeatInterval = null;

            log("Presence heartbeat stopped.");
        }
    }

    function sendMessage() {

        if (!stompClient || !stompClient.connected) {
            alert("Please connect to WebSocket first.");
            return;
        }

        const conversationId =
            document.getElementById("conversationId").value.trim();

        const content =
            document.getElementById("message").value.trim();

        if (!conversationId) {
            alert("Please enter the conversation UUID.");
            return;
        }

        if (!content) {
            alert("Please enter a message.");
            return;
        }

        const payload = {
            conversationId: conversationId,
            content: content
        };

        stompClient.publish({

            destination: "/app/chat.send",

            body: JSON.stringify(payload)

        });

        log("Message sent: " + content);

        document.getElementById("message").value = "";
    }

    function disconnect() {

        stopHeartbeat();

        if (stompClient) {

            stompClient.deactivate();

            stompClient = null;

            updateStatus("Disconnected");

            log("Disconnect requested.");
        }
    }

</script>

</body>
</html>
